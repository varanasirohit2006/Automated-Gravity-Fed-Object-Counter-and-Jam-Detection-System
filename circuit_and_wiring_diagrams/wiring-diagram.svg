<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="Helvetica, Arial, sans-serif">

  <defs>
    <style>
      .ttl   { font-size:27px; font-weight:700; fill:#13243d; }
      .sub   { font-size:15px; fill:#4a5568; }
      .warn  { font-size:15px; font-weight:700; fill:#b3261e; }
      .blk   { font-size:15px; font-weight:700; fill:#13243d; }
      .blks  { font-size:12.5px; fill:#5a6779; }
      .pin   { font-size:14px; font-family:monospace; fill:#13243d; }
      .pinw  { font-size:16px; font-weight:700; fill:#ffffff; }
      .note  { font-size:12.5px; fill:#5a6779; }
      .lbl   { font-size:12.5px; font-family:monospace; fill:#1f3a5f; }
      .leg   { font-size:13.5px; fill:#2d3748; }
      .legh  { font-size:14.5px; font-weight:700; fill:#13243d; }
      .sig   { stroke:#1f3a5f; stroke-width:2.2; fill:none; }
      .p5    { stroke:#c0392b; stroke-width:2.2; fill:none; }
      .p3    { stroke:#e07b00; stroke-width:2.2; fill:none; }
      .gnd   { stroke:#111111; stroke-width:2.2; fill:none; }
      .box   { stroke-width:1.8; }
      .grp   { fill:#fafbfd; stroke:#9aa7b8; stroke-width:1.4; stroke-dasharray:5 4; }
    </style>
  </defs>

  <rect width="1400" height="980" fill="#ffffff"/>

  <!-- ================= TITLE ================= -->
  <text class="ttl" x="700" y="40" text-anchor="middle">Smart Airport Baggage Management System &#8212; STM32F401CCU6 (Black Pill) Wiring</text>
  <text class="sub" x="700" y="64" text-anchor="middle">ADC1 2-channel scan + DMA2 Stream 0 + SysTick 1 ms + EXTI5 &#183; bare metal, Keil &#181;Vision 5 &#183; 16 MHz HSI, no PLL</text>

  <rect x="300" y="80" width="800" height="30" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
  <text class="warn" x="700" y="100" text-anchor="middle">Power both TCRT5000 modules from 3V3 &#8212; PA1 / PA4 are analog inputs and are NOT 5 V tolerant</text>

  <!-- ================= MCU ================= -->
  <rect class="box" x="520" y="180" width="380" height="460" rx="8" fill="#eef2f8" stroke="#1f3a5f"/>
  <rect x="520" y="180" width="380" height="42" rx="8" fill="#1f3a5f"/>
  <rect x="520" y="210" width="380" height="12" fill="#1f3a5f"/>
  <text class="pinw" x="710" y="208" text-anchor="middle">STM32F401CCU6  &#8212;  Black Pill</text>

  <!-- MCU left pins -->
  <text class="pin"  x="534" y="245">PA1</text>
  <text class="blks" x="574" y="245">ADC1_IN1</text>
  <line class="sig" x1="520" y1="240" x2="500" y2="240"/>

  <text class="pin"  x="534" y="325">PA4</text>
  <text class="blks" x="574" y="325">ADC1_IN4</text>
  <line class="sig" x1="520" y1="320" x2="500" y2="320"/>

  <text class="pin" x="534" y="475">3V3</text>
  <line class="p3" x1="520" y1="470" x2="470" y2="470"/>

  <text class="pin" x="534" y="545">GND</text>
  <line class="gnd" x1="520" y1="540" x2="470" y2="540"/>

  <text class="pin"  x="534" y="615">PA13</text>
  <text class="blks" x="582" y="615">PA14  SWD</text>

  <!-- MCU right pins -->
  <text class="pin"  x="886" y="235" text-anchor="end">PA2</text>
  <text class="blks" x="846" y="235" text-anchor="end">USART2_TX</text>
  <line class="sig" x1="900" y1="230" x2="920" y2="230"/>

  <text class="pin"  x="886" y="275" text-anchor="end">PA3</text>
  <text class="blks" x="846" y="275" text-anchor="end">USART2_RX</text>
  <line class="sig" x1="900" y1="270" x2="920" y2="270"/>

  <text class="pin" x="886" y="355" text-anchor="end">5V</text>
  <line class="p5" x1="900" y1="350" x2="950" y2="350"/>

  <text class="pin"  x="886" y="435" text-anchor="end">PB0</text>
  <text class="blks" x="846" y="435" text-anchor="end">buzzer drive</text>
  <line class="sig" x1="900" y1="430" x2="920" y2="430"/>

  <text class="pin"  x="886" y="525" text-anchor="end">PB5</text>
  <text class="blks" x="846" y="525" text-anchor="end">EXTI line 5</text>
  <line class="sig" x1="900" y1="520" x2="920" y2="520"/>

  <text class="pin"  x="886" y="605" text-anchor="end">PC13</text>
  <text class="blks" x="846" y="605" text-anchor="end">on-board LED, no wiring</text>

  <!-- ================= SENSOR 1 ================= -->
  <rect class="box" x="70" y="190" width="200" height="112" rx="7" fill="#fff6e8" stroke="#b26a00"/>
  <text class="blk"  x="170" y="215" text-anchor="middle">SENSOR 1 &#8212; ENTRY</text>
  <text class="blks" x="170" y="234" text-anchor="middle">TCRT5000 reflective module</text>
  <text class="pin"  x="258" y="264" text-anchor="end">AO</text>
  <text class="note" x="82"  y="264">VCC</text>
  <text class="note" x="82"  y="290">GND</text>
  <text class="note" x="188" y="292" text-anchor="middle">DO pin not used</text>

  <line class="sig" x1="270" y1="240" x2="500" y2="240"/>
  <circle cx="270" cy="240" r="3.6" fill="#1f3a5f"/>
  <circle cx="500" cy="240" r="3.6" fill="#1f3a5f"/>
  <text class="lbl" x="385" y="232" text-anchor="middle">analog, 0 &#8211; 3.3 V</text>

  <polyline class="p3" points="70,259 40,259 40,240"/>
  <line class="p3" x1="26" y1="240" x2="54" y2="240"/>
  <text class="lbl" x="40" y="230" text-anchor="middle" fill="#c0392b">3V3</text>

  <polyline class="gnd" points="70,285 40,285 40,306"/>
  <line class="gnd" x1="26" y1="306" x2="54" y2="306"/>
  <line class="gnd" x1="31" y1="312" x2="49" y2="312"/>
  <line class="gnd" x1="36" y1="318" x2="44" y2="318"/>

  <!-- ================= SENSOR 2 ================= -->
  <rect class="box" x="70" y="360" width="200" height="112" rx="7" fill="#fff6e8" stroke="#b26a00"/>
  <text class="blk"  x="170" y="385" text-anchor="middle">SENSOR 2 &#8212; EXIT</text>
  <text class="blks" x="170" y="404" text-anchor="middle">TCRT5000 reflective module</text>
  <text class="pin"  x="258" y="434" text-anchor="end">AO</text>
  <text class="note" x="82"  y="434">VCC</text>
  <text class="note" x="82"  y="460">GND</text>
  <text class="note" x="188" y="462" text-anchor="middle">DO pin not used</text>

  <polyline class="sig" points="270,410 420,410 420,320 500,320"/>
  <circle cx="270" cy="410" r="3.6" fill="#1f3a5f"/>
  <circle cx="500" cy="320" r="3.6" fill="#1f3a5f"/>
  <text class="lbl" x="345" y="402" text-anchor="middle">analog, 0 &#8211; 3.3 V</text>

  <polyline class="p3" points="70,429 40,429 40,410"/>
  <line class="p3" x1="26" y1="410" x2="54" y2="410"/>
  <text class="lbl" x="40" y="400" text-anchor="middle" fill="#c0392b">3V3</text>

  <polyline class="gnd" points="70,455 40,455 40,476"/>
  <line class="gnd" x1="26" y1="476" x2="54" y2="476"/>
  <line class="gnd" x1="31" y1="482" x2="49" y2="482"/>
  <line class="gnd" x1="36" y1="488" x2="44" y2="488"/>

  <!-- MCU 3V3 / GND symbols -->
  <line class="p3" x1="470" y1="470" x2="470" y2="452"/>
  <line class="p3" x1="456" y1="452" x2="484" y2="452"/>
  <text class="lbl"  x="470" y="442" text-anchor="middle" fill="#c0392b">3V3</text>
  <text class="note" x="425" y="498" text-anchor="middle">feeds both sensors</text>

  <polyline class="gnd" points="470,540 470,558"/>
  <line class="gnd" x1="456" y1="558" x2="484" y2="558"/>
  <line class="gnd" x1="461" y1="564" x2="479" y2="564"/>
  <line class="gnd" x1="466" y1="570" x2="474" y2="570"/>
  <text class="note" x="425" y="590" text-anchor="middle">common ground</text>

  <!-- ================= ST-LINK ================= -->
  <rect class="grp" x="300" y="690" width="262" height="96" rx="7"/>
  <text class="blk"  x="431" y="713" text-anchor="middle">ST-LINK/V2  (SWD)</text>
  <text class="note" x="314" y="736">PA13 &#8594; SWDIO    PA14 &#8594; SWCLK</text>
  <text class="note" x="314" y="754">3V3 &#8594; 3.3V        GND &#8594; GND</text>
  <text class="note" x="314" y="772">4 wires, programming only</text>
  <polyline class="sig" points="620,640 620,724 562,724"/>

  <!-- ================= HC-05 ================= -->
  <rect class="box" x="1120" y="190" width="215" height="118" rx="7" fill="#e9f4ff" stroke="#0b5f9e"/>
  <text class="blk"  x="1227" y="215" text-anchor="middle">HC-05 BLUETOOTH</text>
  <text class="blks" x="1227" y="234" text-anchor="middle">9600 baud, data mode</text>
  <text class="pin"  x="1132" y="264">RXD</text>
  <text class="pin"  x="1132" y="290">TXD</text>
  <text class="note" x="1323" y="264" text-anchor="end">VCC</text>
  <text class="note" x="1323" y="290" text-anchor="end">GND</text>

  <polyline class="sig" points="920,230 1040,230 1040,259 1120,259"/>
  <circle cx="920" cy="230" r="3.6" fill="#1f3a5f"/>
  <circle cx="1120" cy="259" r="3.6" fill="#1f3a5f"/>
  <polyline class="sig" points="920,270 1000,270 1000,285 1120,285"/>
  <circle cx="920" cy="270" r="3.6" fill="#1f3a5f"/>
  <circle cx="1120" cy="285" r="3.6" fill="#1f3a5f"/>
  <text class="lbl"  x="1008" y="188" text-anchor="middle">TX&#8594;RXD, RX&#8592;TXD</text>
  <text class="note" x="1008" y="206" text-anchor="middle">(cross them over)</text>

  <polyline class="p5" points="1335,259 1365,259 1365,240"/>
  <line class="p5" x1="1351" y1="240" x2="1379" y2="240"/>
  <text class="lbl" x="1365" y="230" text-anchor="middle" fill="#c0392b">5V</text>

  <polyline class="gnd" points="1335,285 1365,285 1365,304"/>
  <line class="gnd" x1="1351" y1="304" x2="1379" y2="304"/>
  <line class="gnd" x1="1356" y1="310" x2="1374" y2="310"/>
  <line class="gnd" x1="1361" y1="316" x2="1369" y2="316"/>

  <!-- MCU 5V symbol -->
  <line class="p5" x1="950" y1="350" x2="950" y2="332"/>
  <line class="p5" x1="936" y1="332" x2="964" y2="332"/>
  <text class="lbl"  x="950" y="322" text-anchor="middle" fill="#c0392b">5V</text>
  <text class="note" x="952" y="372" text-anchor="middle">HC-05 + buzzer</text>

  <!-- ================= BUZZER DRIVER ================= -->
  <rect class="grp" x="1000" y="390" width="370" height="220" rx="7"/>
  <text class="blk" x="1012" y="412">BUZZER DRIVER</text>

  <!-- buzzer -->
  <circle cx="1230" cy="446" r="22" fill="#ffffff" stroke="#13243d" stroke-width="2"/>
  <path d="M1221 438 q9 10 18 0 M1221 446 q9 10 18 0 M1221 454 q9 10 18 0" fill="none" stroke="#13243d" stroke-width="1.6"/>
  <text class="note" x="1256" y="430">+</text>
  <text class="note" x="1256" y="476">&#8722;</text>
  <text class="lbl"  x="1200" y="446" text-anchor="end">5 V active buzzer</text>

  <line class="p5" x1="1230" y1="424" x2="1230" y2="406"/>
  <line class="p5" x1="1216" y1="406" x2="1244" y2="406"/>
  <text class="lbl" x="1256" y="402" fill="#c0392b">5V</text>

  <!-- wire from PB0 through the base resistor -->
  <polyline class="sig" points="920,430 975,430 975,500 1020,500"/>
  <circle cx="920" cy="430" r="3.6" fill="#1f3a5f"/>
  <rect x="1020" y="491" width="52" height="18" fill="#ffffff" stroke="#13243d" stroke-width="1.8"/>
  <text class="lbl" x="1046" y="484" text-anchor="middle">1 k&#8486;</text>
  <line class="sig" x1="1072" y1="500" x2="1110" y2="500"/>

  <!-- transistor -->
  <line x1="1110" y1="478" x2="1110" y2="522" stroke="#1f3a5f" stroke-width="3.4"/>
  <line class="sig" x1="1110" y1="487" x2="1145" y2="470"/>
  <line class="sig" x1="1110" y1="513" x2="1145" y2="530"/>
  <text class="lbl" x="1104" y="490" text-anchor="end">B</text>
  <text class="lbl" x="1151" y="464">C</text>
  <text class="lbl" x="1155" y="536">E</text>
  <text class="lbl" x="1172" y="500">BC547 / 2N2222 (NPN)</text>

  <polyline class="sig" points="1145,470 1230,470 1230,468"/>
  <circle cx="1230" cy="468" r="3.2" fill="#1f3a5f"/>

  <polyline class="gnd" points="1145,530 1145,548"/>
  <line class="gnd" x1="1131" y1="548" x2="1159" y2="548"/>
  <line class="gnd" x1="1136" y1="554" x2="1154" y2="554"/>
  <line class="gnd" x1="1141" y1="560" x2="1149" y2="560"/>

  <text class="note" x="1012" y="582">a 5 V buzzer draws more current than a GPIO pin can supply,</text>
  <text class="note" x="1012" y="600">so PB0 switches it through a transistor instead of driving it.</text>

  <!-- ================= PUSH BUTTON ================= -->
  <rect class="grp" x="1000" y="650" width="370" height="110" rx="7"/>
  <text class="blk" x="1012" y="674">RESET PUSH BUTTON</text>

  <polyline class="sig" points="920,520 960,520 960,716 1060,716"/>
  <circle cx="920" cy="520" r="3.6" fill="#1f3a5f"/>
  <circle cx="1060" cy="716" r="3.6" fill="#1f3a5f"/>
  <line class="sig" x1="1060" y1="716" x2="1108" y2="698"/>
  <circle cx="1128" cy="716" r="3.6" fill="#1f3a5f"/>
  <line class="sig" x1="1128" y1="716" x2="1160" y2="716"/>
  <text class="lbl" x="1094" y="740" text-anchor="middle">momentary</text>

  <polyline class="gnd" points="1160,716 1180,716 1180,730"/>
  <line class="gnd" x1="1166" y1="730" x2="1194" y2="730"/>
  <line class="gnd" x1="1171" y1="736" x2="1189" y2="736"/>
  <line class="gnd" x1="1176" y1="742" x2="1184" y2="742"/>

  <text class="note" x="1215" y="700">internal pull-up is</text>
  <text class="note" x="1215" y="718">enabled in software,</text>
  <text class="note" x="1215" y="736">no resistor needed</text>

  <!-- ================= LEGEND ================= -->
  <line x1="60" y1="820" x2="1340" y2="820" stroke="#cfd6e0" stroke-width="1.4"/>

  <text class="legh" x="60" y="848">Symbols</text>
  <line class="p5" x1="62" y1="872" x2="92" y2="872"/>
  <text class="leg" x="102" y="877">+5 V rail</text>
  <line class="p3" x1="62" y1="897" x2="92" y2="897"/>
  <text class="leg" x="102" y="902">+3.3 V rail</text>
  <line class="gnd" x1="62" y1="922" x2="92" y2="922"/>
  <text class="leg" x="102" y="927">common ground</text>
  <line class="sig" x1="62" y1="947" x2="92" y2="947"/>
  <text class="leg" x="102" y="952">signal</text>

  <text class="legh" x="310" y="848">Why ADC and DMA are both needed</text>
  <text class="leg" x="310" y="874">The TCRT5000 analog output (AO) is read instead of its digital DO pin, so the</text>
  <text class="leg" x="310" y="895">threshold lives in software and can be tuned without touching a trimpot. ADC1</text>
  <text class="leg" x="310" y="916">scans channel 1 then channel 4, but the ADC has only ONE data register. DMA2</text>
  <text class="leg" x="310" y="937">Stream 0 (channel 0 = ADC1, circular) empties it after every conversion, so</text>
  <text class="leg" x="310" y="958">both sensor values stay valid at all times with zero CPU work.</text>

  <text class="legh" x="930" y="848">Build notes</text>
  <text class="leg" x="930" y="874">&#183; Measure the sensor gap and put it in BELT_GAP_MM.</text>
  <text class="leg" x="930" y="895">&#183; Tie all grounds together, including the ST-LINK.</text>
  <text class="leg" x="930" y="916">&#183; Do not hold the HC-05 KEY pin high at power up.</text>
  <text class="leg" x="930" y="937">&#183; Avoid PA0 (KEY), PB2 (BOOT1), PA13 / PA14 (SWD).</text>
  <text class="leg" x="930" y="958">&#183; If the buzzer is magnetic, add a 1N4148 across it.</text>

</svg>
